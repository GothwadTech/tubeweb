    <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('plustube-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();

      window.addEventListener('error', function (event) {
        var el = event.target;
        var url = el && (el.src || el.href);
        if (!url || url.indexOf('/assets/') === -1) return;
        try {
          if (sessionStorage.getItem('plustube-asset-retry')) return;
          sessionStorage.setItem('plustube-asset-retry', '1');
        } catch (e) {
          return;
        }
        location.reload();
      }, true);
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
